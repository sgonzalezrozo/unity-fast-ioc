name: Tests

# Manual for now: Tools Core is private, so Unity can't clone it without the GIT_PRIVATE_TOKEN secret.
# Add push and pull_request triggers back once that works.
on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Edit Mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Library folder
        uses: actions/cache@v4
        with:
          path: .github/ci-project/Library
          key: library-${{ hashFiles('.github/ci-project/Packages/manifest.json', '.github/ci-project/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .github/ci-project
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Lets Unity clone Tools Core while that repository is private. Not needed once it's public.
          gitPrivateToken: ${{ secrets.GIT_PRIVATE_TOKEN }}
          checkName: Edit Mode test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
